<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#3b82f6">
  <title>그룹 게임 컬렉션-끝말잇기</title>
  <link rel="icon" href="/assets/group-game-logo.png?v=1">
  <link rel="stylesheet" href="/music.css">
  <link rel="stylesheet" href="/music-lobby.css">
  <link rel="stylesheet" href="/word-chain.css">
</head>
<body class="songcatch-lobby-page wc-page">
  <header class="music-header songcatch-lobby-header"><a href="/word-chain" class="mini-brand">← 끝말잇기</a></header>

  <main class="songcatch-lobby-shell">
    <section class="songcatch-lobby-card">
      <div class="wc-logo" aria-hidden="true">가</div>
      <p class="eyebrow">끝말잇기 · 여럿이 방에서</p>
      <h1>끝말잇기</h1>
      <p class="songcatch-lobby-copy">2~8명이 차례대로 끝말을 이어요. 시간 안에 못 대면 탈락, 마지막까지 남으면 우승!</p>

      <label class="songcatch-nickname-label" for="nickname">게임에서 사용할 닉네임</label>
      <div class="songcatch-nickname-row">
        <input id="nickname" maxlength="30" autocomplete="nickname" placeholder="자유롭게 닉네임 입력">
        <span id="nicknameCount">0/30</span>
      </div>
      <p class="songcatch-field-help">이모지와 특수문자도 자유롭게 사용할 수 있어요.</p>

      <div class="songcatch-main-actions">
        <button id="openCreate" class="primary">＋ 방 만들기</button>
        <button id="openRooms" class="secondary">🔎 공개 방 찾기</button>
      </div>
      <button id="openCode" class="songcatch-code-button">⌨ 방 코드로 입장</button>
      <p id="connectionStatus" class="songcatch-connection" role="status">● 서버에 연결하는 중…</p>
    </section>

    <aside class="songcatch-lobby-features" aria-label="게임 규칙">
      <div><span>⏱️</span><strong>시간 안에 한 단어</strong><small>틀려도 시간 안이면 다시 낼 수 있어요</small></div>
      <div><span>💀</span><strong>시간 초과 = 탈락</strong><small>탈락하면 다음 사람이 새 단어로 시작</small></div>
      <div><span>🏆</span><strong>끝까지 살아남기</strong><small>마지막 한 명이 우승!</small></div>
    </aside>
  </main>

  <dialog id="createDialog" class="music-lobby-modal">
    <div class="music-modal-heading"><div><p class="eyebrow">새로운 게임</p><h2>방 만들기</h2></div><button class="music-modal-close" type="button" aria-label="닫기">×</button></div>
    <div class="field"><label for="title">방 제목</label><input id="title" maxlength="30" value="끝말잇기 한 판!"></div>
    <div class="field"><span class="wc-field-label">사전</span>
      <div class="wc-dict-choice" role="radiogroup" aria-label="사전 선택">
        <label><input type="radio" name="dictionary" value="stdict" checked><span><b>표준국어대사전</b><small>표준어 위주 · 깔끔해요</small></span></label>
        <label><input type="radio" name="dictionary" value="opendict"><span><b>우리말샘</b><small>신조어·방언까지 · 단어가 많아요</small></span></label>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label for="maxPlayers">최대 인원</label>
        <select id="maxPlayers"><option value="2">2명</option><option value="3">3명</option><option value="4">4명</option><option value="5">5명</option><option value="6">6명</option><option value="8" selected>8명</option></select></div>
      <div class="field"><label for="turnTime">차례 시간</label>
        <select id="turnTime"><option value="10">10초</option><option value="15" selected>15초</option><option value="20">20초</option><option value="30">30초</option><option value="0">제한 없음</option></select></div>
    </div>
    <div class="songcatch-toggle-list">
      <label><input id="isPublic" type="checkbox" checked><span>공개 방</span></label>
    </div>
    <button id="create" class="primary wide">방 만들고 입장</button>
  </dialog>

  <dialog id="roomsDialog" class="music-lobby-modal music-rooms-modal">
    <div class="music-modal-heading"><div><p class="eyebrow">함께할 방</p><h2>공개 방 찾기</h2></div><button class="music-modal-close" type="button" aria-label="닫기">×</button></div>
    <div class="music-room-filters">
      <input id="roomSearch" placeholder="방 제목 검색" aria-label="방 제목 검색">
      <select id="roomSort" aria-label="방 정렬"><option value="new">최신순</option><option value="players">인원 많은 순</option></select>
      <label class="music-check-inline"><input id="joinableOnly" type="checkbox"> 입장 가능한 방만</label>
      <button id="refresh" class="secondary music-compact">↻ 새로고침</button>
    </div>
    <div id="rooms" class="music-public-rooms" aria-live="polite"></div>
  </dialog>

  <dialog id="codeDialog" class="music-lobby-modal music-code-modal">
    <div class="music-modal-heading"><h2>방 코드로 입장</h2><button class="music-modal-close" type="button" aria-label="닫기">×</button></div>
    <div class="field"><label for="code">6자리 방 코드</label><input id="code" maxlength="6" autocomplete="off" placeholder="A7K3P2"></div>
    <button id="join" class="primary wide">입장하기</button>
  </dialog>

  <div id="notice" class="notice songcatch-lobby-notice hidden" role="alert"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/word-chain-lobby.js"></script>
</body>
</html>
