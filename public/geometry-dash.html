<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>그룹 게임 컬렉션-지오메트리 대쉬</title>
  <link rel="icon" type="image/png" href="/assets/group-game-logo.png">
  <link rel="stylesheet" href="/geometry-dash.css">
</head>
<body>
  <nav class="gd-toolbar" aria-label="게임 메뉴">
    <a href="/">← 그룹 게임 컬렉션</a>
    <div class="gd-toolbar-actions">
      <span class="gd-best">1위 기록 <strong id="bestScoreText">0</strong>m</span>
      <button id="gdMuteButton" type="button" aria-pressed="false">🔊 소리 켜짐</button>
    </div>
  </nav>

  <main class="gd-shell">
    <h1>지오메트리 대쉬</h1>
    <p class="gd-lead">스페이스바 또는 화면을 눌러 점프! 장애물에 닿으면 끝나요.</p>

    <div class="gd-stage-wrap">
      <canvas id="gdCanvas" width="900" height="340" aria-label="지오메트리 대쉬 게임 화면"></canvas>

      <div class="gd-hud">
        <span class="gd-score-label">거리</span>
        <strong id="gdScoreText">0</strong>m
      </div>

      <div id="gdStartOverlay" class="gd-overlay">
        <div class="gd-overlay-card">
          <h2>준비됐나요?</h2>
          <p>스페이스바 · 클릭 · 화면 터치로 점프합니다.<br>가시와 블록에 닿으면 게임이 끝나요.</p>
          <label class="gd-name-label" for="gdNameInput">순위에 표시할 이름</label>
          <input id="gdNameInput" class="gd-name-input" type="text" maxlength="20" placeholder="이름을 입력하세요" autocomplete="off">
          <button id="gdStartButton" class="gd-primary-btn" type="button">시작하기</button>
        </div>
      </div>

      <div id="gdOverOverlay" class="gd-overlay" hidden>
        <div class="gd-overlay-card">
          <h2>게임 오버</h2>
          <p>이번 기록: <strong id="gdFinalScoreText">0</strong>m</p>
          <p id="gdRankText" class="gd-rank-text"></p>
          <button id="gdRetryButton" class="gd-primary-btn" type="button">다시 시작</button>
        </div>
      </div>
    </div>

    <section class="gd-leaderboard" aria-label="전체 순위">
      <div class="gd-leaderboard-head">
        <h2>전체 순위</h2>
        <button id="gdRefreshScoresButton" class="gd-text-btn" type="button">새로고침</button>
      </div>
      <p class="gd-leaderboard-note">이 사이트에서 플레이한 모든 사람의 기록이에요.</p>
      <ol id="gdLeaderboardList" class="gd-leaderboard-list">
        <li class="gd-leaderboard-empty">기록을 불러오는 중…</li>
      </ol>
      <p id="gdMyBestRankText" class="gd-my-rank"></p>
    </section>
  </main>

  <script src="/geometry-dash.js"></script>
</body>
</html>
