<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#8b5cf6">
  <title>그룹 게임 컬렉션-라이어 게임</title>
  <link rel="icon" href="/assets/group-game-logo.png?v=1">
  <link rel="stylesheet" href="/music.css">
  <link rel="stylesheet" href="/word-chain.css">
  <link rel="stylesheet" href="/liar.css">
</head>
<body class="wc-play-page liar-play-page">
  <main class="wc-room-shell">
    <header class="wc-header">
      <a class="wc-brand" href="/liar" aria-label="라이어 게임 첫 화면"><span aria-hidden="true">🤥</span><b>라이어 게임</b></a>
      <div class="wc-title">
        <h1 id="roomTitle">방에 입장하는 중…</h1>
        <button id="copyCode" type="button" title="방 코드 복사" aria-label="방 코드 복사"><small>CODE</small> <strong id="roomCode">------</strong></button>
      </div>
      <span id="modeBadge" class="wc-dict-badge"></span>
      <button id="leave" class="danger">나가기</button>
    </header>

    <section class="wc-status" aria-label="게임 진행 상태">
      <div><small>주제</small><strong id="topic">-</strong></div>
      <div class="wc-status-center"><small id="statusLabel">대기실</small><strong id="statusMessage">모두 준비하면 방장이 시작해요!</strong></div>
      <div><small>남은 시간</small><strong id="timer">--</strong></div>
    </section>

    <section class="wc-layout">
      <aside class="panel wc-side-panel">
        <div class="wc-panel-heading"><h2>참가자 <span id="playerCount">0/0</span></h2></div>
        <div id="players" class="wc-player-list"></div>
        <div class="wc-actions">
          <button id="ready" class="secondary wide hidden">✓ 준비하기</button>
          <button id="start" class="primary wide hidden">▶ 게임 시작</button>
          <button id="closeRoom" class="danger wide hidden">방 종료</button>
        </div>
      </aside>

      <section class="panel wc-board">
        <div class="wc-timebar"><i id="timebar"></i></div>
        <div id="waiting" class="wc-waiting"><span aria-hidden="true">🤥</span><b>방장이 게임을 시작하면 제시어가 나와요</b><small>3명 이상 모이면 시작할 수 있어요</small></div>
        <div id="secret" class="liar-secret hidden" aria-live="polite">
          <small id="secretLabel">내 제시어</small>
          <strong id="secretWord">-</strong>
          <p id="secretHelp"></p>
        </div>
        <ol id="hints" class="liar-hints" aria-label="설명 목록"></ol>
        <form id="hintForm" class="wc-word-form hidden">
          <input id="hintInput" maxlength="40" autocomplete="off" placeholder="한 줄로 설명하기" aria-label="설명 입력">
          <button class="primary" id="hintSend">내기</button>
        </form>
        <form id="guessForm" class="wc-word-form liar-guess-form hidden">
          <input id="guessInput" maxlength="30" autocomplete="off" placeholder="제시어가 뭐였을까요?" aria-label="제시어 맞히기">
          <button class="primary" id="guessSend">정답!</button>
        </form>
        <p id="voteHelp" class="liar-vote-help hidden">🗳️ 참가자 목록에서 라이어라고 생각하는 사람의 <b>찍기</b> 단추를 누르세요. 끝나기 전엔 바꿀 수 있어요.</p>
        <button id="skipTalk" class="secondary wc-giveup hidden">🗳️ 바로 투표하기</button>
        <div id="result" class="notice hidden" role="status"></div>
      </section>

      <aside class="panel wc-side-panel wc-chat-panel">
        <div class="wc-panel-heading"><h2>채팅</h2></div>
        <div id="chat" class="chat" aria-live="polite"></div>
        <div class="answer-row wc-chat-form">
          <input id="chatInput" maxlength="200" autocomplete="off" placeholder="메시지 입력…">
          <button id="chatSend" class="secondary" aria-label="채팅 전송">➤</button>
        </div>
      </aside>
    </section>
  </main>

  <dialog id="resultDialog" class="wc-result-dialog">
    <p class="eyebrow">게임 끝!</p>
    <h2 id="winnerTitle">🙌 시민 승리!</h2>
    <p id="resultReason"></p>
    <div class="liar-reveal">
      <div><small>라이어</small><b id="revealLiar">-</b></div>
      <div><small>제시어</small><b id="revealWord">-</b></div>
      <div id="revealFoolBox" class="hidden"><small>라이어가 받은 제시어</small><b id="revealFool">-</b></div>
    </div>
    <h3 class="liar-section-title">🗳️ 받은 표</h3>
    <ol id="voteTally" class="wc-ranking liar-tally"></ol>
    <h3 class="liar-section-title">🏅 누적 점수</h3>
    <ol id="ranking" class="wc-ranking"></ol>
    <div class="wc-result-actions">
      <button id="again" class="primary hidden">↻ 한 판 더</button>
      <button id="closeResult" class="secondary">닫기</button>
    </div>
  </dialog>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/liar-room.js"></script>
</body>
</html>
