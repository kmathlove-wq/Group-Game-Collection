<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#3b82f6">
  <title>그룹 게임 컬렉션-끝말잇기</title>
  <link rel="icon" href="/assets/group-game-logo.png?v=1">
  <link rel="stylesheet" href="/music.css">
  <link rel="stylesheet" href="/word-chain.css">
</head>
<body class="wc-play-page">
  <main class="wc-solo-shell">
    <header class="wc-header">
      <a class="wc-brand" href="/word-chain"><span aria-hidden="true">가</span><b>끝말잇기</b></a>
      <h1>🤖 컴퓨터랑 대결</h1>
      <span id="dictBadge" class="wc-dict-badge hidden"></span>
      <span id="brainBadge" class="wc-dict-badge hidden"></span>
    </header>

    <section id="setup" class="panel wc-setup">
      <h2>어떤 사전으로 할까요?</h2>
      <div class="wc-dict-choice" role="radiogroup" aria-label="사전 선택">
        <label><input type="radio" name="dictionary" value="stdict" checked><span><b>표준국어대사전</b><small>꼭 필요한 표준어 위주 · 깔끔해요</small></span></label>
        <label><input type="radio" name="dictionary" value="opendict"><span><b>우리말샘</b><small>신조어·방언·전문어까지 · 단어가 아주 많아요</small></span></label>
      </div>
      <div class="field"><span class="wc-field-label">어떤 컴퓨터랑 할까요?</span>
        <div class="wc-dict-choice wc-first-choice wc-mode-choice" role="radiogroup" aria-label="컴퓨터 종류">
          <label><input type="radio" name="mode" value="basic" checked><span><b>🎲 기본 컴퓨터</b><small>단어를 무작위로 골라요</small></span></label>
          <label><input type="radio" name="mode" value="growth"><span><b>🌱 성장하는 컴퓨터</b><small>진 한방단어를 기억해서 점점 강해져요</small></span></label>
          <label><input type="radio" name="mode" value="master"><span><b>🏆 고수 컴퓨터</b><small id="masterNote">⏳ 단어 지도를 준비하는 중이에요…</small></span></label>
        </div>
        <p id="brainInfo" class="wc-brain-info hidden" aria-live="polite"></p>
      </div>
      <div id="thinkField" class="field hidden"><label for="think">🏆 고수 컴퓨터 생각 시간 <small>(1~60초 · 짧으면 쉽고 길면 어려워요)</small></label>
        <div class="wc-think-input"><input id="think" type="number" min="1" max="60" step="1" value="5" inputmode="numeric"><span>초</span></div></div>
      <div class="field"><span class="wc-field-label">누가 먼저 할까요?</span>
        <div class="wc-dict-choice wc-first-choice" role="radiogroup" aria-label="먼저 할 사람">
          <label><input type="radio" name="first" value="me" checked><span><b>🙋 내가 먼저</b><small>아무 단어로 시작해요</small></span></label>
          <label><input type="radio" name="first" value="computer"><span><b>🤖 컴퓨터 먼저</b><small>컴퓨터의 첫 단어에 이어 말해요</small></span></label>
        </div>
      </div>
      <div class="field"><label for="turnTime">차례 시간</label>
        <select id="turnTime"><option value="10">10초</option><option value="15">15초</option><option value="20" selected>20초</option><option value="30">30초</option><option value="0">제한 없음</option></select></div>
      <button id="start" class="primary wide">▶ 시작하기</button>
      <div id="setupNotice" class="notice error hidden" role="alert"></div>
    </section>

    <section id="game" class="panel wc-game hidden">
      <div class="wc-status">
        <div><small>이은 단어</small><strong id="score">0</strong></div>
        <div class="wc-status-center"><small id="statusLabel">내 차례!</small><strong id="prompt">아무 단어로 시작하세요</strong></div>
        <div><small>남은 시간</small><strong id="timer">--</strong></div>
      </div>
      <div class="wc-timebar"><i id="timebar"></i></div>
      <ol id="chain" class="wc-chain" aria-live="polite"></ol>
      <form id="wordForm" class="wc-word-form">
        <input id="word" maxlength="60" autocomplete="off" placeholder="단어 입력 후 Enter" aria-label="단어 입력">
        <button class="primary" id="send">내기</button>
      </form>
      <div id="message" class="notice hidden" role="status"></div>
      <button id="giveup" class="secondary wc-giveup">🏳 포기하기</button>
    </section>
  </main>

  <dialog id="resultDialog" class="wc-result-dialog">
    <p class="eyebrow">게임 끝!</p>
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
    <div class="wc-result-actions">
      <button id="again" class="primary">↻ 다시 하기</button>
      <button id="closeResult" class="secondary">단어 다시 보기</button>
    </div>
  </dialog>

  <script src="/word-chain-common.js"></script>
  <script src="/word-chain-solo.js"></script>
</body>
</html>
