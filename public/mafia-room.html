<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1e1b4b">
  <title>그룹 게임 컬렉션-마피아 게임</title>
  <link rel="icon" href="/assets/group-game-logo.png?v=1">
  <link rel="stylesheet" href="/music.css">
  <link rel="stylesheet" href="/word-chain.css">
  <link rel="stylesheet" href="/mafia.css">
</head>
<body class="wc-play-page mafia-play-page">
  <main class="wc-room-shell">
    <header class="wc-header">
      <a class="wc-brand" href="/mafia" aria-label="마피아 게임 첫 화면"><span aria-hidden="true">🕵️</span><b>마피아 게임</b></a>
      <div class="wc-title">
        <h1 id="roomTitle">방에 입장하는 중…</h1>
        <button id="copyCode" type="button" title="방 코드 복사" aria-label="방 코드 복사"><small>CODE</small> <strong id="roomCode">------</strong></button>
      </div>
      <span id="aliveBadge" class="wc-dict-badge"></span>
      <button id="leave" class="danger">나가기</button>
    </header>

    <section class="wc-status" aria-label="게임 진행 상태">
      <div><small>날짜</small><strong id="dayLabel">-</strong></div>
      <div class="wc-status-center"><small id="statusLabel">대기실</small><strong id="statusMessage">모두 준비하면 방장이 시작해요!</strong></div>
      <div><small>남은 시간</small><strong id="timer">--</strong></div>
    </section>

    <section class="wc-layout">
      <aside class="panel wc-side-panel">
        <div class="wc-panel-heading"><h2>참가자 <span id="playerCount">0/0</span></h2></div>
        <div id="players" class="wc-player-list"></div>
        <div class="wc-actions">
          <button id="ready" class="secondary wide hidden">✓ 준비하기</button>
          <button id="start" class="primary wide hidden">▶ 게임 시작</button>
          <button id="closeRoom" class="danger wide hidden">방 종료</button>
        </div>
      </aside>

      <section class="panel wc-board">
        <div class="wc-timebar"><i id="timebar"></i></div>
        <div id="waiting" class="wc-waiting"><span aria-hidden="true">🕵️</span><b>방장이 게임을 시작하면 직업이 정해져요</b><small>4명 이상 모이면 시작할 수 있어요</small></div>
        <div id="roleCard" class="mafia-role hidden" aria-live="polite">
          <span id="roleEmoji" aria-hidden="true">🙂</span>
          <div><small>내 직업</small><strong id="roleName">-</strong><p id="roleHelp"></p></div>
        </div>
        <p id="actionHelp" class="mafia-action-help hidden"></p>
        <div class="mafia-buttons">
          <button id="skipVote" class="secondary hidden">🙅 기권하기</button>
          <button id="skipDay" class="secondary hidden">🗳️ 바로 투표하기</button>
        </div>
        <h3 class="mafia-news-title">📰 마을 소식</h3>
        <ol id="news" class="mafia-news" aria-live="polite"></ol>
        <div id="result" class="notice hidden" role="status"></div>
      </section>

      <aside class="panel wc-side-panel wc-chat-panel">
        <div class="wc-panel-heading"><h2>채팅 <span id="chatChannel"></span></h2></div>
        <div id="chat" class="chat" aria-live="polite"></div>
        <div class="answer-row wc-chat-form">
          <input id="chatInput" maxlength="200" autocomplete="off" placeholder="메시지 입력…">
          <button id="chatSend" class="secondary" aria-label="채팅 전송">➤</button>
        </div>
      </aside>
    </section>
  </main>

  <dialog id="resultDialog" class="wc-result-dialog">
    <p class="eyebrow">게임 끝!</p>
    <h2 id="winnerTitle">🙌 시민 승리!</h2>
    <p id="resultReason"></p>
    <h3 class="mafia-news-title">모두의 직업</h3>
    <ol id="roleList" class="wc-ranking"></ol>
    <div class="wc-result-actions">
      <button id="again" class="primary hidden">↻ 한 판 더</button>
      <button id="closeResult" class="secondary">닫기</button>
    </div>
  </dialog>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/mafia-room.js"></script>
  <script src="/shared/name-lock.js"></script>
</body>
</html>
